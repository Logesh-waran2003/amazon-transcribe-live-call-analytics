name: Build UI and Deploy to lca-terraform

on:
  push:
    branches: [develop]
    paths:
      - 'lca-ai-stack/source/ui/**'
      - 'lca-ai-stack/deployment/**'

  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lca-ai-stack/source/ui

    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Download Lex Web UI assets
        run: chmod +x download-lexwebui.sh && ./download-lexwebui.sh

      - name: Build
        run: NODE_OPTIONS=--max-old-space-size=4096 npx react-scripts build
        env:
          CI: false
          DISABLE_ESLINT_PLUGIN: true

      - name: Deploy build to lca-terraform
        env:
          SHORT_SHA: ${{ github.sha }}
        run: |
          cd $GITHUB_WORKSPACE
          git clone https://x-access-token:${{ secrets.LCA_TERRAFORM_PAT }}@github.com/Logesh-waran2003/lca-terraform.git /tmp/lca-terraform
          cd /tmp/lca-terraform
          rm -rf build/*
          cp -r $GITHUB_WORKSPACE/lca-ai-stack/source/ui/build/* build/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add build/
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Update build from ${SHORT_SHA:0:7}"
          git push origin main
